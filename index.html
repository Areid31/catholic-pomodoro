<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pomodoro Web App</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Background video -->
  <video autoplay muted loop id="bgVideo" style="display:none;">
    <source id="bgVideoSrc" src="" type="video/mp4">
  </video>

  <!-- Dark overlay -->
  <div class="background-overlay"></div>

  <!-- Top Left: App Name -->
  <div class="top-left">
    <h2>Pomodoro Web App</h2>
  </div>

  <!-- Top Right: Quotes -->
  <div class="top-right" id="quoteBox">
    <p id="quoteText">"Your quote will appear here."</p>
  </div>

  <!-- Center: Timer -->
  <div class="center-timer">
    <h1>Pomodoro Timer</h1>
    <div id="mode">Work Session</div>
    <div id="timer">25:00</div>
    <div class="timer-buttons">
      <button class="control" onclick="startTimer()">Start</button>
      <button class="control" onclick="pauseTimer()">Pause</button>
      <button class="control" onclick="resetTimer()">Reset</button>
    </div>
  </div>

  <!-- Bottom Left: Audio Controls -->
  <div class="bottom-left">
    <div class="audio-icons">
      <!-- Ambient Sounds Menu -->
      <div class="menu-wrapper">
        <button class="menu-btn" title="Ambient Sounds">🌧️</button>
        <div class="menu-content">
          <button id="btn-rain" onclick="toggleSound('rain', this)">Rain</button>
          <div class="slider-container">
              <input type="range" min="0" max="1" step="0.01" value="0.5" onchange="setVolume('rain', this.value)">
          </div>
          <button id="btn-cafe" onclick="toggleSound('cafe', this)">Cafe</button>
          <div class="slider-container">
              <input type="range" min="0" max="1" step="0.01" value="0.5" onchange="setVolume('cafe', this.value)">
          </div>
        </div>
      </div>
      
      <!-- YouTube Menu -->
      <div class="menu-wrapper">
        <button class="menu-btn" title="Lofi YouTube">🎵</button>
        <div class="menu-content">
          <iframe width="300" height="150" 
            src="https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=0" 
            frameborder="0" allow="autoplay; encrypted-media" allowfullscreen>
          </iframe>
        </div>
      </div>
    
      <!-- Spotify Menu -->
      <div class="menu-wrapper">
        <button class="menu-btn" title="Spotify">🎶</button>
        <div class="menu-content">
          <iframe style="border-radius:12px" 
            src="https://open.spotify.com/embed/playlist/37i9dQZF1DWYcDQ1hSjOpY?utm_source=generator" 
            width="300" height="80" frameborder="0" 
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
          </iframe>
        </div>
      </div>
    
    </div>    

  <!-- Bottom Right Panel -->
  <div class="bottom-right-panel">
    <!-- Background Selector -->
    <div class="background-selector">
      <label for="bgSelect">Choose Background:</label>
      <select id="bgSelect" onchange="changeBackground(this.value)">
        <option value="gradient">Gradient</option>
        <option value="church_interior.jpg">Church</option>
        <option value="pexels-aleksandar069-11239782.jpg">Sunset</option>
        <option value="pexels-canaros-2182359.jpg">Rain</option>
        <option value="14424684_3840_2160_30fps.mp4">Lofi Video</option>
      </select>
    </div>

    <!-- Full-Screen Icon Button -->
    <button id="fullscreenBtn" class="fullscreen-btn" onclick="toggleFullScreen()">
      ⛶
    </button>
  </div>

  <!-- Ambient Audio -->
  <audio id="rain" loop>
    <source src="audio/calming-rain-257596.mp3" type="audio/mpeg">
  </audio>
  <audio id="cafe" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" type="audio/mpeg">
  </audio>

  <script src="script.js"></script>
</body>
</html>
