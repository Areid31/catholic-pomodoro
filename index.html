<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pomodoro Web App</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>Pomodoro Timer</h1>
  <div id="mode">Work Session</div>
  <div id="timer">25:00</div>

  <div>
    <button class="control" onclick="startTimer()">Start</button>
    <button class="control" onclick="pauseTimer()">Pause</button>
    <button class="control" onclick="resetTimer()">Reset</button>
  </div>

  <!-- Background Selector -->
  <div class="background-selector">
    <label for="bgSelect">Choose Background:</label>
    <select id="bgSelect" onchange="changeBackground(this.value)">
      <option value="church_interior.jpg">Church</option>
      <option value="sunset.jpg">Sunset</option>
      <option value="rain.gif">Rain</option>
      <option value="lofi.mp4">Lofi Video</option>
    </select>
  </div>

  <!-- Video Background -->
  <video autoplay muted loop id="bgVideo" style="display:none;">
    <source id="bgVideoSrc" src="" type="video/mp4">
  </video>

  <!-- Moving Background Video -->
  <!-- <video autoplay loop muted id="bgVideoMoving">
    <source src="backgrounds/pomodoro.mp4" type="video/mp4">
  </video> -->


  <!-- Audio Mixer -->
  <div class="mixer">
    <h3>Audio Mixer</h3>

    <div>
      <p>Lofi Music (YouTube)</p>
      <iframe width="300" height="150" 
        src="https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=0" 
        frameborder="0" allow="autoplay; encrypted-media" allowfullscreen>
      </iframe>
    </div>

    <div>
      <p>Spotify Playlist</p>
      <iframe style="border-radius:12px" 
        src="https://open.spotify.com/embed/playlist/37i9dQZF1DWYcDQ1hSjOpY?utm_source=generator" 
        width="300" height="80" frameBorder="0" 
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
      </iframe>
    </div>

    <div>
      <p>Ambient Sounds</p>
      <audio id="rain" loop>
        <source src="audio/calming-rain-257596.mp3" type="audio/mpeg">
      </audio>
      <button onclick="document.getElementById('rain').play()">Play Rain</button>         

      <audio id="cafe" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" type="audio/mpeg">
      </audio>      

      <div class="slider-container">
        <label>Rain Volume: <input type="range" min="0" max="1" step="0.01" value="0.5" onchange="setVolume('rain', this.value)"></label>
      </div>
      <div class="slider-container">
        <label>Cafe Volume: <input type="range" min="0" max="1" step="0.01" value="0.5" onchange="setVolume('cafe', this.value)"></label>
      </div>
      <button class="control" onclick="playAmbient()">Play Ambient</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
