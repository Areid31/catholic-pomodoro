<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Catholic Pomodoro</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" rel="stylesheet">

</head>

<body>
  <!-- Background video -->
  <video autoplay muted loop id="bgVideo" style="display:none;">
    <source id="bgVideoSrc" src="" type="video/mp4">
  </video>

  <!-- Dark overlay -->
  <div class="background-overlay"></div>

  <!-- Top Left: App Name -->
  <div class="top-left">
    <h2>Catholic Pomodoro</h2>
  </div>

  <!-- Top Right: Quotes -->
  <div class="top-right" id="quoteBox">
    <p id="quoteText">"Your quote will appear here."</p>
  </div>

  <!-- Center: Timer -->
  <div class="center-timer">
    <h1>
      Hello <span id="userName" contenteditable="true" title="Click to edit your name">[EnterName]</span>
    </h1>
    <div id="mode">Focus Time!</div>
    <div class="mode-selector">
      <button class="mode-btn active" data-mode="work" onclick="setMode('work')">Work</button>
      <button class="mode-btn" data-mode="short" onclick="setMode('short')">Short Break</button>
      <button class="mode-btn" data-mode="long" onclick="setMode('long')">Long Break</button>
    </div>
    <div id="timer">25:00</div>
    <div class="timer-buttons">
      <button class="control" onclick="startTimer()">Start</button>
      <button class="control" onclick="pauseTimer()">Pause</button>
      <button class="control" onclick="resetTimer()">Reset</button>
    </div>
  </div>

  <audio id="alarmSound">
    <source src="audio/alarm-2-375697.mp3" type="audio/mpeg">
  </audio>

  <!-- Bottom Left: Audio Controls -->
  <div class="bottom-left">
    <div class="audio-icons">
      <!-- Ambient Sounds Menu -->
      <div class="menu-wrapper">
        <button class="menu-btn" title="Ambient Sounds">🌧️</button>
        <div class="menu-content">
          <button id="btn-rain" onclick="toggleSound('rain', this)">Rain</button>
          <div class="slider-container">
              <input type="range" min="0" max="1" step="0.01" value="0.5" onchange="setVolume('rain', this.value)">
          </div>
          <button id="btn-cafe" onclick="toggleSound('cafe', this)">Cafe</button>
          <div class="slider-container">
              <input type="range" min="0" max="1" step="0.01" value="0.5" onchange="setVolume('cafe', this.value)">
          </div>
        </div>
      </div>
      
      <!-- YouTube Menu -->
      <div class="menu-wrapper">
        <button class="menu-btn" title="Lofi YouTube">🎵</button>
        <div class="menu-content">
          <iframe width="300" height="150" 
            src="https://www.youtube.com/embed/7oijjSxs1ic?autoplay=0" 
            frameborder="0" allow="autoplay; encrypted-media" allowfullscreen>
          </iframe>
        </div>
      </div>
    
      <!-- Spotify Menu -->
      <div class="menu-wrapper">
        <button class="menu-btn" title="Spotify">🎶</button>
        <div class="menu-content">
          <iframe style="border-radius:12px" 
            src="https://open.spotify.com/embed/artist/4ZA0g9A7x6NyiDoowyyKNF?utm_source=generator" 
            width="300" height="80" frameborder="0" 
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
          </iframe>
        </div>
      </div>
    </div>    
  </div>

  <!-- Ambient Audio -->
  <audio id="rain" loop>
    <source src="audio/calming-rain-257596.mp3" type="audio/mpeg">
  </audio>
  <audio id="cafe" loop>
    <source src="audio/cafe-noise-32940.mp3" type="audio/mpeg">
  </audio>

  <!-- Bottom Right Panel -->
  <div class="bottom-right-panel">
    <!-- Background Selector -->
    <button id="bgChangeBtn" onclick="openBgModal()" title="Change Background"><i class="far fa-image"></i></button>
    <div id="bgModal" class="modal">
      <div class="modal-content">
        <span class="close" onclick="closeBgModal()">&times;</span>
        <h3>Select a Background</h3>
        <div class="bg-grid">
          <img src="backgrounds/pexels-codioful-7130560.jpg" onclick="changeBackground('gradient')">
          <img src="backgrounds/church_interior.jpg" alt="Church" onclick="changeBackground('church_interior.jpg')">
          <img src="backgrounds/pexels-aleksandar069-11239782.jpg" alt="Sunset" onclick="changeBackground('pexels-aleksandar069-11239782.jpg')">
          <img src="backgrounds/pexels-canaros-2182359.jpg" alt="Rain" onclick="changeBackground('pexels-canaros-2182359.jpg')">
          <img src="backgrounds/pexels-castorlystock-3836343.jpg" alt="Lofi Video" onclick="changeBackground('pexels-castorlystock-3836343.jpg')">
        </div>
      </div>
    </div>

    <!-- Full-Screen Icon Button -->
    <button id="fullscreenBtn" class="fullscreen-btn" onclick="toggleFullScreen()">
      ⛶
    </button>
  </div>

  <script src="script.js"></script>
</body>
</html>
